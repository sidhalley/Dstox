<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 6px;
      width: 100%;
      height: 100%;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .chart-card {
      width: 100%;
      height: 170px;
      min-height: 170px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e0e3eb;
    }
  </style>
</head>
<body>

  <!-- 1. Dow Jones (DJI) -->
  <div class="chart-card">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://tradingview.com" async>
      {
        "symbol": "FOREXCOM:DJI",
        "width": "100%",
        "height": "100%",
        "locale": "en",
        "dateRange": "1D",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": true,
        "largeChartUrl": ""
      }
      </script>
    </div>
  </div>

  <!-- 2. S&P 500 -->
  <div class="chart-card">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://tradingview.com" async>
      {
        "symbol": "FOREXCOM:SPXUSD",
        "width": "100%",
        "height": "100%",
        "locale": "en",
        "dateRange": "1D",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": true,
        "largeChartUrl": ""
      }
      </script>
    </div>
  </div>

  <!-- 3. NASDAQ -->
  <div class="chart-card">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://tradingview.com" async>
      {
        "symbol": "FOREXCOM:NSXUSD",
        "width": "100%",
        "height": "100%",
        "locale": "en",
        "dateRange": "1D",
        "colorTheme": "light",
        "isTransparent": true,
        "autosize": true,
        "largeChartUrl": ""
      }
      </script>
    </div>
  </div>

</body>
</html>
