<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-mini-chart.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 6px;
      background-color: #f8f9fa;
    }
    .chart-card {
      width: 100%;
      height: 170px;
      margin-bottom: 8px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e0e3eb;
    }
    tv-mini-chart {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 1. Dow Jones (DJI) -->
  <div class="chart-card">
    <tv-mini-chart symbol="FOREXCOM:DJI" time-frame="1D" theme="light" transparent></tv-mini-chart>
  </div>

  <!-- 2. S&P 500 -->
  <div class="chart-card">
    <tv-mini-chart symbol="FOREXCOM:SPXUSD" time-frame="1D" theme="light" transparent></tv-mini-chart>
  </div>

  <!-- 3. NASDAQ -->
  <div class="chart-card">
    <tv-mini-chart symbol="FOREXCOM:NSXUSD" time-frame="1D" theme="light" transparent></tv-mini-chart>
  </div>

</body>
</html>
